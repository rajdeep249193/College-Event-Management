spring.application.name=college-event-management
server.port=8081

# Data is stored in a local file so it survives restarts.
spring.datasource.url=jdbc:h2:file:./data/collegeevents;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:sa}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Demo account passwords: defaults keep local dev simple but environment variables override them.
app.security.admin-password=${ADMIN_PASSWORD:AdminPass123}
app.security.student-password=${STUDENT_PASSWORD:StudentPass123}

# Sample events are added on first start when the database is empty.
app.demo-data.enabled=${DEMO_DATA_ENABLED:true}

# H2 console is disabled unless explicitly enabled for local development.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false